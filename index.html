<style>
  
  /* ENTER SECTION */
.enter-section {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 30px; /* space between buttons and radio */
  flex-wrap: wrap; /* stack on mobile */
  width: 100%;
  max-width: 720px; /* same width as radio player */
}

.enter-section a {
  padding: 15px 30px;
  border-radius: 10px;
  font-family: 'Orbitron', sans-serif;
  text-decoration: none;
  text-align: center;
  transition: transform 0.2s, box-shadow 0.2s;
  flex: 1 1 200px; /* responsive width, min 200px */
}

/* Hawkins - military sign vibe */
.enter-hawkins {
  background: #222;
  color: #00ff88;
  border: 3px solid #00ff88;
  box-shadow: 0 0 15px #00ff88;
  text-transform: uppercase;
  letter-spacing: 2px;
  font-weight: bold;
}

.enter-hawkins:hover {
  transform: scale(1.05);
  box-shadow: 0 0 25px #00ff88;
}
.enter-upside-down {
  position: relative;
  background: #200000;
  color: #ff0000;
  border: 3px solid #ff0000;
  box-shadow: 0 0 15px #ff0000;
  text-transform: uppercase;
  letter-spacing: 3px;
  font-family: 'Press Start 2P', cursive;
  overflow: hidden;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
   transform: scale(1.05) rotate(-2deg);
  box-shadow: 
    0 0 25px #ff0000, 
    0 0 40px #aa0000;
  animation: simple-glitch 0.15s steps(2) infinite;
}

/* Simple glitch animation */
@keyframes simple-glitch {
  0%   { transform: translate(0); }
  20%  { transform: translate(-1px, 1px); }
  40%  { transform: translate(1px, -1px); }
  60%  { transform: translate(-1px, 0); }
  80%  { transform: translate(1px, 1px); }
  100% { transform: translate(0); }
}

/* Hover effect */
.enter-upside-down:hover {
 
}

  
  
  body {
  background: radial-gradient(circle at top, #1b0033, #000);
  display: flex;
  flex-direction: column; /* stack vertically */
  justify-content: center;
  align-items: center;
  min-height: 99vh;
  margin: 0;
}

/* RADIO FRAME */
.radio-wrapper {
  width: 720px;
  background: linear-gradient(145deg, #1c1c1c, #0a0a0a);
  border-radius: 20px;
  padding: 20px;
  box-shadow:
    0 0 25px #ff00ff,
    inset 0 0 15px #00ffff;
  border: 4px solid #ff00ff;
}
  
  .blue {
  background: #00aaff;
  color: #00aaff;
}

.purple {
  background: #bb00ff;
  color: #bb00ff;
}


/* HEADER */
.radio-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 12px;
}

.station {
  font-family: 'Orbitron', sans-serif;
  color: #00ffff;
  font-size: 18px;
  text-shadow: 0 0 10px #00ffff;
}
  
  .radio-footer.labeled {
  gap: 12px;
}

.radio-btn.label {
  width: auto;
  padding: 6px 10px;
  border-radius: 6px;
  background: linear-gradient(#333, #111);
  color: #00ffff;
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  letter-spacing: 1px;
  border: 1px solid #00ffff;
  box-shadow: 0 0 8px #00ffff;
}


.tagline {
  font-family: 'Press Start 2P', cursive;
  color: #ff00ff;
  font-size: 19px;
}

/* BODY */
.radio-body {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 15px;
}

/* CONTROLS */
.radio-controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
}

.knob {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: radial-gradient(circle, #555, #111);
  border: 3px solid #00ffff;
  box-shadow: 0 0 10px #00ffff;
}

.slider {
  width: 20px;
  height: 120px;
  background: linear-gradient(#222, #000);
  border: 2px solid #ff00ff;
  position: relative;
}

.slider::after {
  content: '';
  width: 26px;
  height: 10px;
  background: #ff00ff;
  position: absolute;
  top: 40%;
  left: -4px;
  box-shadow: 0 0 10px #ff00ff;
}

/* SCREEN */
.screen {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  border: 3px solid #00ffff;
  box-shadow: inset 0 0 20px #00ffff;
}

.screen iframe {
  width: 100%;
  height: 315px;
  border: none;
}

/* CRT SCANLINES */
.scanlines {
  pointer-events: none;
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,0.2),
    rgba(0,0,0,0.2) 1px,
    transparent 2px,
    transparent 4px
  );
}

/* FOOTER BUTTONS */
.radio-footer {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 15px;
}

.radio-btn {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: none;
  box-shadow: 0 0 8px currentColor;
}

.red { background: #ff0044; color: #ff0044; }
.yellow { background: #ffee00; color: #ffee00; }
.green { background: #00ff88; color: #00ff88; }
  
  
  
  
  /* 80s DIGITAL CLOCK */
.hawkins-clock {
  display: flex; flex-direction: column;
   align-items: center;
  margin-bottom: 12px;
  font-family: 'Orbitron', sans-serif;
  position:fixed;
  bottom:50px;
}

#clock-label {
  font-size: 9px;
  letter-spacing: 2px;
  color: #ff4444;
  opacity: 0.8;
  margin-bottom: 4px;
}

#digital-clock {
  font-size: 22px;
  color: #ff0000;
  letter-spacing: 2px;
  text-shadow:
    0 0 5px #ff0000,
    0 0 10px #ff0000,
    0 0 20px #ff2222,
    0 0 40px rgba(255,0,0,0.6);
}

  
</style>
<script>
  function updateClock() {
    const now = new Date();

    const time = now.toLocaleTimeString('en-US', {
      timeZone: 'America/New_York',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: true
    });

    document.getElementById('digital-clock').textContent = time;
  }

  updateClock();
  setInterval(updateClock, 1000);
</script>
