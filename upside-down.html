<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>uʍop ǝpᴉsd∩</title>

<style>
body {
  margin: 0;
  background: #000000;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: crosshair;
}

svg {
  width: 90vw;
  height: auto;
  touch-action: none;
}
</style>
</head>

<body>

<svg id="svg" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="distort" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence
        type="turbulence"
        baseFrequency="0.01"
        numOctaves="2"
        result="noise"
      />
      <feDisplacementMap
        id="displacement"
        in="SourceGraphic"
        in2="noise"
        scale="0"
        xChannelSelector="R"
        yChannelSelector="G"
      />
      <feColorMatrix
        id="hue"
        type="hueRotate"
        values="0"
      />
    </filter>
  </defs>

  <image
    id="img"
    href="https://images.unsplash.com/photo-1723739003389-cbcdbd54281a?q=80&w=1600&auto=format&fit=crop"
    width="1600"
    height="1000"
    filter="url(#distort)"
          filter="url(#distort)"
  transform="translate(0 1000) scale(1 -1)"
  />
</svg>


<script>
const svg = document.getElementById('svg');
const displacement = document.getElementById('displacement');
const hue = document.getElementById('hue');

svg.addEventListener('pointermove', e => {
  const rect = svg.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const dx = (x - rect.width / 2) / 6;
  const dy = (y - rect.height / 2) / 6;

  displacement.setAttribute('scale', dx);
  hue.setAttribute('values', dy);
});
</script>

</body>
</html>
