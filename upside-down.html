<meta charset="UTF-8">
<title>uʍop ǝpᴉsd∩</title>

<style>
body {
  margin: 0;
  background: #000000;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: crosshair;
}

svg {
  width: 90vw;
  height: auto;
  touch-action: none;
}
</style>
</head>

<body>

<svg id="svg" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="distort" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" baseFrequency="0.01" numOctaves="2" result="noise"/>
      <feDisplacementMap id="displacement" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G"/>
      <feColorMatrix id="hue" type="hueRotate" values="0"/>
    </filter>
  </defs>

  <image
    id="img"
    href="https://images.unsplash.com/photo-1723739003389-cbcdbd54281a?q=80&w=1600&auto=format&fit=crop"
    width="1600" height="1000"
    filter="url(#distort)"
    transform="translate(0 1000) scale(1 -1)"
  />
</svg>

<script>
const svg = document.getElementById('svg');
const displacement = document.getElementById('displacement');
const hue = document.getElementById('hue');

// Apply distortion effect at x, y
function applyEffect(x, y) {
  const rect = svg.getBoundingClientRect();
  const dx = (x - rect.width / 2) / 2;
  const dy = (y - rect.height / 2) / 2;
  displacement.setAttribute('scale', dx);
  hue.setAttribute('values', dy);
}

// --- Optional real pointer control ---
let isActive = false;
let activePointerId = null;

svg.addEventListener('pointerdown', e => {
  isActive = true;
  activePointerId = e.pointerId;
  svg.setPointerCapture(activePointerId);
});

svg.addEventListener('pointermove', e => {
  if (!isActive || e.pointerId !== activePointerId) return;
  const rect = svg.getBoundingClientRect();
  applyEffect(e.clientX - rect.left, e.clientY - rect.top);
});

function endPointer(e) {
  if (e.pointerId !== activePointerId) return;
  isActive = false;
  activePointerId = null;
  displacement.setAttribute('scale', 0);
  hue.setAttribute('values', 0);
}

svg.addEventListener('pointerup', endPointer);
svg.addEventListener('pointercancel', endPointer);
svg.addEventListener('pointerleave', endPointer);

// --- Random multi-swipe animation (slower) ---
let swipePatterns = [];
let currentSwipe = 0;
let swipeStartTime = performance.now();

// Generate random swipe patterns
function generateSwipes() {
  swipePatterns = [];
  for (let i = 0; i < 3; i++) {
    swipePatterns.push({
      centerX: 0.2 + Math.random() * 0.6, // random center
      centerY: 0.2 + Math.random() * 0.6,
      duration: 14000 + Math.random() * 2000, // 14–16 seconds per swipe (slower!)
      amplitudeX: 0.1 + Math.random() * 0.2, // slightly smaller amplitude for smoothness
      amplitudeY: 0.03 + Math.random() * 0.1,
      speedY: 0.3 + Math.random() * 0.6
    });
  }
}

generateSwipes(); // initialize

function autoSwipe(time) {
  const rect = svg.getBoundingClientRect();
  const swipe = swipePatterns[currentSwipe];
  const elapsed = time - swipeStartTime;

  // Move to next swipe pattern when duration ends
  if (elapsed > swipe.duration) {
    currentSwipe = (currentSwipe + 1) % swipePatterns.length;
    swipeStartTime = time;
    return requestAnimationFrame(autoSwipe);
  }

  const t = elapsed / swipe.duration;

  // Horizontal: slow smooth back-and-forth
  const x = rect.width * (swipe.centerX + Math.sin(t * Math.PI * 2) * swipe.amplitudeX);
  // Vertical: gentle oscillation
  const y = rect.height * (swipe.centerY + Math.cos(t * Math.PI * 2 * swipe.speedY) * swipe.amplitudeY);

  applyEffect(x, y);
  requestAnimationFrame(autoSwipe);
}

// Start the slow automatic swipes
requestAnimationFrame(autoSwipe);
</script>

</body>
</html>
