<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hawkins, Indiana | WSQK 94.5 FM</title>
  <meta name="description" content="Welcome to Hawkins, Indiana. Tune into WSQK 94.5 FM and connect with Hawkins through our secure transmission form.">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="wsqk-radio.css">
</head>

<body>

  <!-- RADIO -->
  <div class="radio-wrapper">
    <div class="radio-header">
      <h1 class="station">WSQK 94.5 FM</h1>
      <h2 class="tagline">HAWKINS SIGNAL</h2>
    </div>

    <div class="radio-body">
      <div class="radio-controls">
        <div class="knob"></div>
        <div class="knob"></div>
        <div class="slider"></div>
      </div>

      <div class="screen">
        <iframe 
          src="https://www.youtube.com/embed/videoseries?list=PLauPolv1u0BxY69jwVIqCtrzuYCU4FO3o&autoplay=1&mute=0"
          title="WSQK Radio"
          allow="autoplay; encrypted-media; picture-in-picture"
          allowfullscreen>
        </iframe>
        <div class="scanlines"></div>
      </div>
    </div>

    <div class="radio-footer labeled">
      <button class="radio-btn label">FM</button>
      <button class="radio-btn label">AM</button>
      <button class="radio-btn label">AUX</button>
      <button class="radio-btn label">REC</button>
    </div>
  </div>
  <!-- TRANSMISSION FORM -->
  <div class="hawkins-form">
    <h3>Secure Hawkins Transmission</h3>
    <p>Report activity, request contact, or establish signal access.</p>

    <script type="text/javascript" src="https://form.jotform.com/jsform/260145821932050"></script>
  </div>

  <!-- CLOCK -->
  <div class="hawkins-clock">
    <span id="clock-label">HAWKINS, IN</span>
    <span id="digital-clock">00:00:00</span>
  </div>

</body>
</html>

<style>
body {
  background: radial-gradient(circle at top, #0a1a12, #000);
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  margin: 0;
}

/* RADIO */
.radio-wrapper {
  width: 720px;
  background: linear-gradient(145deg, #1c1c1c, #0a0a0a);
  border-radius: 20px;
  padding: 20px;
  margin-top: 40px;
  box-shadow: 0 0 30px #00ff88, inset 0 0 15px #00ff88;
  border: 4px solid #00ff88;
}

.radio-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 12px;
}

.station {
  font-family: 'Orbitron', sans-serif;
  color: #00ff88;
  font-size: 18px;
  text-shadow: 0 0 10px #00ff88;
}

.tagline {
  font-family: 'Press Start 2P', cursive;
  color: #66ffcc;
  font-size: 16px;
}

.radio-body {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 15px;
}

.radio-controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
}

.knob {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: radial-gradient(circle, #555, #111);
  border: 3px solid #00ff88;
  box-shadow: 0 0 10px #00ff88;
}

.slider {
  width: 20px;
  height: 120px;
  background: linear-gradient(#222, #000);
  border: 2px solid #00ff88;
  position: relative;
}

.slider::after {
  content: '';
  width: 26px;
  height: 10px;
  background: #00ff88;
  position: absolute;
  top: 40%;
  left: -4px;
  box-shadow: 0 0 10px #00ff88;
}

.screen {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  border: 3px solid #00ff88;
  box-shadow: inset 0 0 20px #00ff88;
}

.screen iframe {
  width: 100%;
  height: 315px;
  border: none;
}

.scanlines {
  pointer-events: none;
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,0.2),
    rgba(0,0,0,0.2) 1px,
    transparent 2px,
    transparent 4px
  );
}

.radio-footer.labeled {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 15px;
}

.radio-btn.label {
  padding: 6px 10px;
  background: #111;
  color: #00ff88;
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  border: 1px solid #00ff88;
  box-shadow: 0 0 8px #00ff88;
}

/* FORM */ 
.hawkins-form {
  width: 80%;
  margin: 40px auto 120px;
  padding: 25px;
    height: 520px;          /* adjust as needed */
  overflow-y: auto;       /* enables vertical scroll */
  overflow-x: hidden;
  border: 2px solid #00ff88;
  box-shadow: 0 0 25px #00ff88;
  background: rgba(0,0,0,0.75);
  text-align: center;
}

.hawkins-form h3 {
  font-family: 'Orbitron', sans-serif;
  color: #00ff88;
  margin-bottom: 10px;
}

.hawkins-form p {
  font-size: 12px;
  color: #99ffdd;
  margin-bottom: 20px;
  
}

/* CLOCK */
.hawkins-clock {
  position: fixed;
  bottom: 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  font-family: 'Orbitron', sans-serif;
}

#clock-label {
  font-size: 9px;
  letter-spacing: 2px;
  color: #66ffcc;
  margin-bottom: 4px;
}

#digital-clock {
  font-size: 22px;
  color: #00ff88;
  text-shadow: 0 0 10px #00ff88;
}
</style>

<script>
function updateClock() {
  const now = new Date();
  const time = now.toLocaleTimeString('en-US', {
    timeZone: 'America/New_York',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: true
  });
  document.getElementById('digital-clock').textContent = time;
}
updateClock();
setInterval(updateClock, 1000);
</script>
